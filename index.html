<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbitais Atômicos — Visualização 3D de Densidade Quântica</title>
    <meta name="description" content="Visualização interativa 3D de orbitais atômicos com nuvens de probabilidade quântica para orbitais s, p, d e f.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #07080f;
            --bg-card: rgba(15, 18, 35, 0.85);
            --bg-card-hover: rgba(22, 26, 50, 0.95);
            --border-subtle: rgba(100, 120, 255, 0.12);
            --border-glow: rgba(100, 120, 255, 0.3);
            --text-primary: #e8ecf4;
            --text-secondary: rgba(200, 210, 240, 0.65);
            --text-muted: rgba(160, 170, 200, 0.45);
            --accent-s: #4fa3ff;
            --accent-p: #3ddc84;
            --accent-d: #ff9f43;
            --accent-f: #b565f7;
            --glow-s: rgba(79, 163, 255, 0.4);
            --glow-p: rgba(61, 220, 132, 0.4);
            --glow-d: rgba(255, 159, 67, 0.4);
            --glow-f: rgba(181, 101, 247, 0.4);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: linear-gradient(180deg, rgba(7,8,15,0.95) 0%, rgba(7,8,15,0) 100%);
            pointer-events: none;
        }

        .top-bar > * {
            pointer-events: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-s), var(--accent-f));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 20px rgba(100,120,255,0.25);
        }

        .logo-text {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .logo-sub {
            font-weight: 300;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .particle-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
        }

        .orbital-panel {
            position: fixed;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .orbital-btn {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(12px);
        }

        .orbital-btn::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .orbital-btn:hover {
            transform: scale(1.08);
            border-color: var(--border-glow);
            background: var(--bg-card-hover);
        }

        .orbital-btn.active {
            transform: scale(1.1);
        }

        .orbital-btn[data-orbital="s"].active {
            color: var(--accent-s);
            border-color: var(--accent-s);
            box-shadow: 0 0 25px var(--glow-s), inset 0 0 15px rgba(79,163,255,0.08);
        }

        .orbital-btn[data-orbital="p"].active {
            color: var(--accent-p);
            border-color: var(--accent-p);
            box-shadow: 0 0 25px var(--glow-p), inset 0 0 15px rgba(61,220,132,0.08);
        }

        .orbital-btn[data-orbital="d"].active {
            color: var(--accent-d);
            border-color: var(--accent-d);
            box-shadow: 0 0 25px var(--glow-d), inset 0 0 15px rgba(255,159,67,0.08);
        }

        .orbital-btn[data-orbital="f"].active {
            color: var(--accent-f);
            border-color: var(--accent-f);
            box-shadow: 0 0 25px var(--glow-f), inset 0 0 15px rgba(181,101,247,0.08);
        }

        .orbital-label {
            position: absolute;
            left: calc(100% + 12px);
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.25s ease;
            pointer-events: none;
            background: var(--bg-card);
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        .orbital-btn:hover .orbital-label,
        .orbital-btn.active .orbital-label {
            opacity: 1;
            transform: translateX(0);
        }

        .info-panel {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 100;
            width: 300px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
        }

        .info-panel:hover {
            border-color: var(--border-glow);
        }

        .info-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-title .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .info-quantum {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .info-desc {
            font-size: 13px;
            line-height: 1.65;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .info-formula {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
            line-height: 1.6;
        }

        .sub-orbital-panel {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 6px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
        }

        .sub-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .sub-btn:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
        }

        .sub-btn.active {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .settings-panel {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            padding: 20px 16px;
        }

        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .setting-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
            cursor: pointer;
        }

        .setting-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            border: 2px solid var(--bg-primary);
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
            cursor: pointer;
        }

        .setting-slider::-moz-range-thumb {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            border: 2px solid var(--bg-primary);
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
            cursor: pointer;
        }

        .transition-flash {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .transition-flash.active {
            opacity: 1;
            animation: flash 0.5s ease-out forwards;
        }

        @keyframes flash {
            0% { opacity: 0.15; }
            100% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .info-panel { width: 260px; right: 12px; bottom: 12px; padding: 18px; }
            .orbital-panel { left: 12px; }
            .settings-panel { display: none; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="top-bar">
    <div class="logo">
        <div class="logo-icon">⚛</div>
        <div>
            <div class="logo-text">Quantum Orbitals</div>
            <div class="logo-sub">Probability Density Viewer</div>
        </div>
    </div>
    <div class="particle-count" id="particle-count">● 0 partículas</div>
</div>

<div class="orbital-panel" id="orbital-panel">
    <button class="orbital-btn active" data-orbital="s" id="btn-s">
        s
        <span class="orbital-label">Orbital s (esférico)</span>
    </button>
    <button class="orbital-btn" data-orbital="p" id="btn-p">
        p
        <span class="orbital-label">Orbital p (lobular)</span>
    </button>
    <button class="orbital-btn" data-orbital="d" id="btn-d">
        d
        <span class="orbital-label">Orbital d (quadrilobular)</span>
    </button>
    <button class="orbital-btn" data-orbital="f" id="btn-f">
        f
        <span class="orbital-label">Orbital f (multilobular)</span>
    </button>
</div>

<div class="sub-orbital-panel" id="sub-orbital-panel"></div>

<div class="settings-panel">
    <div class="setting-row">
        <span class="setting-label">Partículas</span>
        <input type="range" class="setting-slider" id="slider-particles" min="2000" max="25000" value="12000" step="1000">
    </div>
    <div class="setting-row">
        <span class="setting-label">Dinâmica</span>
        <input type="range" class="setting-slider" id="slider-motion" min="0" max="100" value="40">
    </div>
    <div class="setting-row">
        <span class="setting-label">Tamanho</span>
        <input type="range" class="setting-slider" id="slider-size" min="1" max="8" value="3" step="0.5">
    </div>
</div>

<div class="info-panel" id="info-panel">
    <div class="info-title" id="info-title">
        <span class="dot" id="info-dot" style="background: var(--accent-s)"></span>
        Orbital 1s
    </div>
    <div class="info-quantum" id="info-quantum">n=1 · ℓ=0 · m=0</div>
    <div class="info-desc" id="info-desc">
        Distribuição esférica simétrica. A probabilidade de encontrar o elétron diminui exponencialmente com a distância ao núcleo.
    </div>
    <div class="info-formula" id="info-formula">
        ψ₁ₛ = (1/√π)(1/a₀)^(3/2) · e^(-r/a₀)
    </div>
</div>

<div class="transition-flash" id="transition-flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const ORBITAL_DATA = {
    s: {
        color: [0.31, 0.64, 1.0],
        cssColor: 'var(--accent-s)',
        glowColor: 'var(--glow-s)',
        subs: [

                formula: 'ψ₁ₛ = (1/√π)(1/a₀)^(3/2) · e^(-r/a₀)',
                quantum: 'n=1 · ℓ=0 · m=0'
            },

                name: '2s', n: 2, l: 0, m: 0,

                formula: 'ψ₂ₛ = (1/4√2π)(1/a₀)^(3/2)(2-r/a₀)e^(-r/2a₀)',
                quantum: 'n=2 · ℓ=0 · m=0'
            },
            {
                name: '3s', n: 3, l: 0, m: 0,
                desc: 'Ainda maior com dois nós radiais. A estrutura de camadas torna-se visível na nuvem de probabilidade.',
                formula: 'ψ₃ₛ = (1/81√3π)(1/a₀)^(3/2)(27-18r/a₀+2r²/a₀²)e^(-r/3a₀)',
                quantum: 'n=3 · ℓ=0 · m=0'
            }
        ]
    },
    p: {
        color: [0.24, 0.86, 0.52],
        cssColor: 'var(--accent-p)',
        glowColor: 'var(--glow-p)',
        subs: [
            {
                name: '2pz', n: 2, l: 1, m: 0,
                desc: 'Dois lóbulos ao longo do eixo Z com um plano nodal no equador. Forma clássica de haltere.',
                formula: 'ψ₂pz = (1/4√2π)(1/a₀)^(3/2)(r/a₀)e^(-r/2a₀)·cos θ',
                quantum: 'n=2 · ℓ=1 · m=0'
            },
            {
                name: '2px', n: 2, l: 1, m: 1,
                desc: 'Dois lóbulos ao longo do eixo X. Combinação linear de m=+1 e m=−1.',
                formula: 'ψ₂px = (1/4√2π)(1/a₀)^(3/2)(r/a₀)e^(-r/2a₀)·sin θ cos φ',
                quantum: 'n=2 · ℓ=1 · m=±1'
            },
            {
                name: '2py', n: 2, l: 1, m: -1,
                desc: 'Dois lóbulos ao longo do eixo Y. Combinação linear de m=+1 e m=−1.',
                formula: 'ψ₂py = (1/4√2π)(1/a₀)^(3/2)(r/a₀)e^(-r/2a₀)·sin θ sin φ',
                quantum: 'n=2 · ℓ=1 · m=±1'
            },
            {
                name: '3pz', n: 3, l: 1, m: 0,
                desc: 'Lóbulos maiores com um nó radial adicional, criando anéis internos na distribuição.',
                formula: 'ψ₃pz ∝ (6-r/a₀)(r/a₀)e^(-r/3a₀)·cos θ',
                quantum: 'n=3 · ℓ=1 · m=0'
            }
        ]
    },
    d: {
        color: [1.0, 0.62, 0.26],
        cssColor: 'var(--accent-d)',
        glowColor: 'var(--glow-d)',
        subs: [
            {
                name: '3dz²', n: 3, l: 2, m: 0,
                desc: 'Dois lóbulos ao longo de Z com um anel toroidal (donut) no plano equatorial. Simetria única.',
                formula: 'ψ₃dz² ∝ r²e^(-r/3a₀)·(3cos²θ - 1)',
                quantum: 'n=3 · ℓ=2 · m=0'
            },
            {
                name: '3dxz', n: 3, l: 2, m: 1,
                desc: 'Quatro lóbulos no plano XZ, com planos nodais nos planos XY e YZ.',
                formula: 'ψ₃dxz ∝ r²e^(-r/3a₀)·sin θ cos θ cos φ',
                quantum: 'n=3 · ℓ=2 · m=±1'
            },
            {
                name: '3dyz', n: 3, l: 2, m: -1,
                desc: 'Quatro lóbulos no plano YZ, com planos nodais nos planos XY e XZ.',
                formula: 'ψ₃dyz ∝ r²e^(-r/3a₀)·sin θ cos θ sin φ',
                quantum: 'n=3 · ℓ=2 · m=±1'
            },
            {
                name: '3dxy', n: 3, l: 2, m: 2,
                desc: 'Quatro lóbulos no plano XY, rotacionados 45° em relação aos eixos, formando uma roseta.',
                formula: 'ψ₃dxy ∝ r²e^(-r/3a₀)·sin²θ sin(2φ)',
                quantum: 'n=3 · ℓ=2 · m=±2'
            },
            {
                name: '3dx²-y²', n: 3, l: 2, m: -2,
                desc: 'Quatro lóbulos alinhados aos eixos X e Y no plano equatorial.',
                formula: 'ψ₃dx²-y² ∝ r²e^(-r/3a₀)·sin²θ cos(2φ)',
                quantum: 'n=3 · ℓ=2 · m=±2'
            }
        ]
    },
    f: {
        color: [0.71, 0.40, 0.97],
        cssColor: 'var(--accent-f)',
        glowColor: 'var(--glow-f)',
        subs: [
            {
                name: '4fz³', n: 4, l: 3, m: 0,
                desc: 'Lóbulos complexos ao longo de Z com anéis adicionais. Padrão multilobular intrincado.',
                formula: 'ψ₄fz³ ∝ r³e^(-r/4a₀)·(5cos³θ - 3cosθ)',
                quantum: 'n=4 · ℓ=3 · m=0'
            },
            {
                name: '4fxz²', n: 4, l: 3, m: 1,
                desc: 'Seis lóbulos com simetria complexa, combinando componentes radiais e angulares avançadas.',
                formula: 'ψ₄fxz² ∝ r³e^(-r/4a₀)·sinθ(5cos²θ-1)cosφ',
                quantum: 'n=4 · ℓ=3 · m=±1'
            },
            {
                name: '4fyz²', n: 4, l: 3, m: -1,
                desc: 'Similar ao fxz² mas orientado no plano YZ. Alta complexidade angular.',
                formula: 'ψ₄fyz² ∝ r³e^(-r/4a₀)·sinθ(5cos²θ-1)sinφ',
                quantum: 'n=4 · ℓ=3 · m=±1'
            },
            {
                name: '4fxyz', n: 4, l: 3, m: 2,
                desc: 'Oito lóbulos arranjados em forma de cubo, com orientação diagonal complexa.',
                formula: 'ψ₄fxyz ∝ r³e^(-r/4a₀)·sin²θ cosθ sin(2φ)',
                quantum: 'n=4 · ℓ=3 · m=±2'
            },
            {
                name: '4fz(x²-y²)', n: 4, l: 3, m: -2,
                desc: 'Oito lóbulos, seis no plano equatorial e dois polares, padrão cristalino.',
                formula: 'ψ₄fz(x²-y²) ∝ r³e^(-r/4a₀)·sin²θ cosθ cos(2φ)',
                quantum: 'n=4 · ℓ=3 · m=±2'
            },
            {
                name: '4fx(x²-3y²)', n: 4, l: 3, m: 3,
                desc: 'Seis lóbulos em padrão trifólico no plano equatorial, alta simetria rotacional.',
                formula: 'ψ₄fx(x²-3y²) ∝ r³e^(-r/4a₀)·sin³θ cos(3φ)',
                quantum: 'n=4 · ℓ=3 · m=±3'
            },
            {
                name: '4fy(3x²-y²)', n: 4, l: 3, m: -3,
                desc: 'Seis lóbulos em padrão trifólico rotacionado 30° em relação ao anterior.',
                formula: 'ψ₄fy(3x²-y²) ∝ r³e^(-r/4a₀)·sin³θ sin(3φ)',
                quantum: 'n=4 · ℓ=3 · m=±3'
            }
        ]
    }
};

function radialPart(r, n, l) {
    const rho = 2 * r / n;
    let L = 1;
    if (n === 1 && l === 0) {
        L = 1;
    } else if (n === 2 && l === 0) {
        L = 2 - rho;
    } else if (n === 2 && l === 1) {
        L = 1;
    } else if (n === 3 && l === 0) {
        L = 27 - 18 * rho + 2 * rho * rho;
    } else if (n === 3 && l === 1) {
        L = 6 - rho;
    } else if (n === 3 && l === 2) {
        L = 1;
    } else if (n === 4 && l === 0) {
        L = 1 - (3/2)*rho + (1/2)*rho*rho - (1/24)*rho*rho*rho;
    } else if (n === 4 && l === 1) {
        L = 20 - 10*rho + rho*rho;
    } else if (n === 4 && l === 2) {
        L = 1 - rho/6;
    } else if (n === 4 && l === 3) {
        L = 1;
    }
    const R = Math.pow(r, l) * L * Math.exp(-r / n);
    return R;
}

function angularPart(theta, phi, l, m, subName) {
    const ct = Math.cos(theta);
    const st = Math.sin(theta);

    if (l === 0) return 1;

    if (l === 1) {
        if (subName.includes('pz') || m === 0) return ct;
        if (subName.includes('px')) return st * Math.cos(phi);
        if (subName.includes('py')) return st * Math.sin(phi);
        return ct;
    }

    if (l === 2) {
        if (subName.includes('dz')) return 3 * ct * ct - 1;
        if (subName.includes('dxz')) return st * ct * Math.cos(phi);
        if (subName.includes('dyz')) return st * ct * Math.sin(phi);
        if (subName.includes('dxy')) return st * st * Math.sin(2 * phi);
        if (subName.includes('dx²') || subName.includes('dx2')) return st * st * Math.cos(2 * phi);
        return 3 * ct * ct - 1;
    }

    if (l === 3) {
        if (subName.includes('fz³') || subName.includes('fz3') || (m === 0 && subName.includes('z')))
            return 5 * ct * ct * ct - 3 * ct;
        if (subName.includes('fxz²') || subName.includes('fxz2'))
            return st * (5 * ct * ct - 1) * Math.cos(phi);
        if (subName.includes('fyz²') || subName.includes('fyz2'))
            return st * (5 * ct * ct - 1) * Math.sin(phi);
        if (subName.includes('fxyz'))
            return st * st * ct * Math.sin(2 * phi);
        if (subName.includes('fz(x'))
            return st * st * ct * Math.cos(2 * phi);
        if (subName.includes('fx(x'))
            return st * st * st * Math.cos(3 * phi);
        if (subName.includes('fy(3') || subName.includes('fy('))
            return st * st * st * Math.sin(3 * phi);
        return 5 * ct * ct * ct - 3 * ct;
    }

    return 1;
}

function generateOrbitalPoints(orbitalType, subIndex, count) {
    const sub = ORBITAL_DATA[orbitalType].subs[subIndex];
    const n = sub.n;
    const l = sub.l;
    const m = sub.m;
    const subName = sub.name;

    const positions = new Float32Array(count * 3);
    const rMax = n * n * 3.5;
    const scale = 0.8;

    let psiMax = 0;
    for (let i = 0; i < 5000; i++) {
        const r = Math.random() * rMax;
        const theta = Math.random() * Math.PI;
        const phi = Math.random() * 2 * Math.PI;
        const R = radialPart(r, n, l);
        const Y = angularPart(theta, phi, l, m, subName);
        const psi2 = R * R * Y * Y * r * r * Math.sin(theta);
        if (psi2 > psiMax) psiMax = psi2;
    }

    let idx = 0;
    let attempts = 0;
    const maxAttempts = count * 200;

    while (idx < count && attempts < maxAttempts) {
        attempts++;
        const r = Math.random() * rMax;
        const theta = Math.acos(1 - 2 * Math.random());
        const phi = Math.random() * 2 * Math.PI;

        const R = radialPart(r, n, l);
        const Y = angularPart(theta, phi, l, m, subName);
        const psi2 = R * R * Y * Y * r * r;
        const prob = psi2 / psiMax;

        if (Math.random() < prob) {
            const x = r * Math.sin(theta) * Math.cos(phi) * scale;
            const y = r * Math.sin(theta) * Math.sin(phi) * scale;
            const z = r * Math.cos(theta) * scale;

            positions[idx * 3] = x;
            positions[idx * 3 + 1] = y;
            positions[idx * 3 + 2] = z;
            idx++;
        }
    }

    while (idx < count) {
        positions[idx * 3] = 0;
        positions[idx * 3 + 1] = 0;
        positions[idx * 3 + 2] = 0;
        idx++;
    }

    return positions;
}

const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x07080f, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07080f, 0.012);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(12, 8, 16);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

const nucleusGeo = new THREE.SphereGeometry(0.18, 32, 32);
const nucleusMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.9
});
const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
scene.add(nucleus);

const glowGeo = new THREE.SphereGeometry(0.4, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
    color: 0x4fa3ff,
    transparent: true,
    opacity: 0.12
});
const nucleusGlow = new THREE.Mesh(glowGeo, glowMat);
scene.add(nucleusGlow);

function createAxisLine(dir, len, color) {
    const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.08 });
    const points = [
        new THREE.Vector3(-dir.x * len, -dir.y * len, -dir.z * len),
        new THREE.Vector3(dir.x * len, dir.y * len, dir.z * len)
    ];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    return new THREE.Line(geo, mat);
}
scene.add(createAxisLine(new THREE.Vector3(1,0,0), 30, 0x334466));
scene.add(createAxisLine(new THREE.Vector3(0,1,0), 30, 0x334466));
scene.add(createAxisLine(new THREE.Vector3(0,0,1), 30, 0x334466));

function createParticleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
    gradient.addColorStop(0.5, 'rgba(255,255,255,0.3)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
}

const particleTexture = createParticleTexture();

let currentOrbital = 's';
let currentSubIndex = 0;
let particleCount = 12000;
let motionIntensity = 0.4;
let particleSize = 3;

let particles = null;
let particleGeometry = null;
let particleMaterial = null;
let basePositions = null;
let velocities = null;

function createParticleSystem(orbitalType, subIndex) {
    if (particles) {
        scene.remove(particles);
        particleGeometry.dispose();
        particleMaterial.dispose();
    }

    const colorData = ORBITAL_DATA[orbitalType].color;
    const positions = generateOrbitalPoints(orbitalType, subIndex, particleCount);

    basePositions = new Float32Array(positions);

    velocities = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
        velocities[i * 3] = (Math.random() - 0.5) * 0.3;
        velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
        velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
    }

    particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const alphas = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
        alphas[i] = 0.3 + Math.random() * 0.5;
    }
    particleGeometry.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

    particleMaterial = new THREE.PointsMaterial({
        size: particleSize * 0.04,
        map: particleTexture,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        color: new THREE.Color(colorData[0], colorData[1], colorData[2]),
        sizeAttenuation: true
    });

    particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    glowMat.color.setRGB(colorData[0], colorData[1], colorData[2]);

    document.getElementById('particle-count').textContent = `● ${particleCount.toLocaleString()} partículas`;
}

function updateInfoPanel(orbitalType, subIndex) {
    const data = ORBITAL_DATA[orbitalType];
    const sub = data.subs[subIndex];
    document.getElementById('info-dot').style.background = data.cssColor;
    document.getElementById('info-title').innerHTML =
        `<span class="dot" id="info-dot" style="background:${data.cssColor}"></span> Orbital ${sub.name}`;
    document.getElementById('info-quantum').textContent = sub.quantum;
    document.getElementById('info-desc').textContent = sub.desc;
    document.getElementById('info-formula').textContent = sub.formula;
}

function updateSubOrbitalButtons(orbitalType) {
    const panel = document.getElementById('sub-orbital-panel');
    panel.innerHTML = '';
    const subs = ORBITAL_DATA[orbitalType].subs;
    subs.forEach((sub, i) => {
        const btn = document.createElement('button');
        btn.className = 'sub-btn' + (i === currentSubIndex ? ' active' : '');
        btn.textContent = sub.name;
        btn.addEventListener('click', () => {
            currentSubIndex = i;
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            triggerTransition();
            createParticleSystem(currentOrbital, currentSubIndex);
            updateInfoPanel(currentOrbital, currentSubIndex);
        });
        panel.appendChild(btn);
    });
}

function triggerTransition() {
    const flash = document.getElementById('transition-flash');
    const data = ORBITAL_DATA[currentOrbital];
    flash.style.background = `radial-gradient(circle, ${data.glowColor} 0%, transparent 70%)`;
    flash.classList.remove('active');
    void flash.offsetWidth;
    flash.classList.add('active');
}

document.querySelectorAll('.orbital-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const orbital = btn.dataset.orbital;
        if (orbital === currentOrbital) return;

        document.querySelectorAll('.orbital-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentOrbital = orbital;
        currentSubIndex = 0;
        triggerTransition();
        updateSubOrbitalButtons(orbital);
        createParticleSystem(orbital, 0);
        updateInfoPanel(orbital, 0);
    });
});

document.getElementById('slider-particles').addEventListener('input', (e) => {
    particleCount = parseInt(e.target.value);
    createParticleSystem(currentOrbital, currentSubIndex);
});

document.getElementById('slider-motion').addEventListener('input', (e) => {
    motionIntensity = parseInt(e.target.value) / 100;
});

document.getElementById('slider-size').addEventListener('input', (e) => {
    particleSize = parseFloat(e.target.value);
    if (particleMaterial) {
        particleMaterial.size = particleSize * 0.04;
    }
});

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    controls.update();

    if (particles && basePositions && velocities) {
        const posAttr = particleGeometry.attributes.position;
        const posArray = posAttr.array;
        const motionScale = motionIntensity * 0.15;

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const phase = i * 0.017 + time * 0.8;
            posArray[i3] = basePositions[i3] + Math.sin(phase + velocities[i3] * 10) * motionScale;
            posArray[i3 + 1] = basePositions[i3 + 1] + Math.cos(phase * 1.3 + velocities[i3 + 1] * 10) * motionScale;
            posArray[i3 + 2] = basePositions[i3 + 2] + Math.sin(phase * 0.7 + velocities[i3 + 2] * 10) * motionScale;
        }
        posAttr.needsUpdate = true;
    }

    const pulse = 0.18 + Math.sin(time * 2) * 0.02;
    nucleus.scale.setScalar(pulse / 0.18);
    nucleusGlow.scale.setScalar(1 + Math.sin(time * 1.5) * 0.15);
    nucleusGlow.material.opacity = 0.08 + Math.sin(time * 2) * 0.04;

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

updateSubOrbitalButtons('s');
createParticleSystem('s', 0);
updateInfoPanel('s', 0);
animate();

</script>
</body>
</html>
